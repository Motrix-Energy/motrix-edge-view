server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The shell is public, and that is a decision rather than an omission. This is the same
    # index.html that CI publishes as a build artefact and the README tells people to
    # download from a release and double-click — there is nothing in it to protect, and a
    # login screen in front of a file anyone can already have is theatre. It would also
    # break file mode for someone who only wanted to open a CSV offline, which is the
    # primary use of this tool. The gate is on /api/ below, where the data actually is.
    location / {
        try_files $uri /index.html;
        # The build carries no content hash, so a cached copy would outlive a new tag.
        add_header Cache-Control "no-cache";
        # Repeated here, NOT inherited. nginx applies an outer-level add_header only when
        # the current level defines none of its own — so the line above was silently
        # dropping both security headers for the one location that serves the app, while
        # /api/ (which defines no add_header) inherited them. Exactly backwards.
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }

    # THE TRAILING SLASH ON proxy_pass IS LOAD-BEARING.
    #
    # The EMS serves bare /health, /devices, /devices/{name:path} and /workers. FastAPI's
    # `root_path` option only relabels /docs and /openapi.json — it does NOT remount the
    # routes. So:
    #   proxy_pass http://edge:8000;   ->  /api/health arrives as /api/health  ->  404
    #   proxy_pass http://edge:8000/;  ->  nginx replaces the matched prefix   ->  /health
    #
    # vite.config.ts's dev proxy does the identical rewrite for the identical reason.
    # THESE TWO FILES MUST CHANGE TOGETHER.
    location /api/ {
        # Written at container start by /docker-entrypoint.d/40-viewer-auth.sh — either the
        # auth_basic pair, or `auth_basic off;` when VIEWER_AUTH=off. It ships in the image
        # already gated with an EMPTY .htpasswd, so a hook that never runs rejects everyone
        # rather than admitting everyone.
        #
        # NOT in conf.d/: the main nginx.conf globs that directory into http{}, and an
        # auth_basic landing there would gate the static shell too.
        include /etc/nginx/viewer-auth.conf;

        proxy_pass http://edge:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep-alive to the upstream: the viewer polls, and a new connection per poll is
        # pure overhead.
        proxy_set_header Connection "";

        # Never forward the browser's credentials to the EMS. The EMS has no auth of its
        # own and would ignore them, but forwarding would create a coupling nobody
        # intended — and would put the password in its access log the day it grows one.
        proxy_set_header Authorization "";

        # /devices deep-copies every device under devices_lock, so it is not instant on a
        # large site — but it must still fail fast when the EMS is simply not there.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # NOTE FOR A FUTURE LIVE MODE: if LiveSource ever moves from polling to SSE, this
        # block needs `proxy_buffering off`, a long read timeout, and X-Accel-Buffering: no.
        # "SSE works in dev and hangs in the container" is this setting, every time.
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 16k;
    }

    # A bare /api is a redirect, not a 404 — it is the first thing anyone types by hand.
    # Deliberately NOT gated: it reveals nothing, and gating it would make `curl /api`
    # answer 401 before it answers "you meant /api/", turning a trivial diagnosis into a
    # confusing one. Its target is gated, so nothing leaks.
    location = /api { return 308 /api/; }

    gzip on;
    # text/html is not listed: nginx always gzips it, and naming it here is a duplicate that
    # logs a warning on every single start.
    gzip_types application/json;
    gzip_min_length 1024;

    # The API sets Cache-Control: no-store on every response (services/rest_api.py), so
    # authenticated data is never held by a browser or intermediary cache. That is the
    # EMS's guarantee, not this file's, and it is worth knowing this file depends on it.
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    # No CSP, deliberately. The single-file build is one inline <script> and one inline
    # <style>, so any policy here would need 'unsafe-inline' for both and would buy exactly
    # nothing. Stating the trade-off beats shipping a header that only looks like security.
}
