version: 2

# The other half of SHA-pinning the workflows.
#
# A pin without a mover is a freeze, and a frozen action stays on whatever bug or advisory
# its commit carried — the same objection that argues against pinning the base images by
# digest, where nothing would ever bump them. This is what makes the pins safe: the versions
# still advance, but they advance as a pull request a human reads, rather than because
# somebody else moved a tag under us.
#
# Dependabot rewrites the SHA and the trailing `# v4` comment together, so the pin stays
# readable after an update.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One PR rather than eight. These move together in practice, and a single diff is
      # easier to review than a queue of one-line bumps nobody reads to the end.
      actions:
        patterns: ['*']
